<div class="flex flex-col lg:flex-row px-2 py-2 {% if include.theme %}bg-{{ include.theme }}{% endif %}">
  <div class="w-full flex flex-row lg:flex-col lg:w-1/3 pr-2 mb-2 lg:mb-0 justify-between">
    {% if include.title %}
    <div class="w-1/3 lg:w-full pr-2 body font-bold">{{ include.title }}</div>
    {% else %}
    <div></div>
    {% endif %}
    {% if include.caption %}
    <div class="w-2/3 lg:w-full">
      <hr class="hidden lg:block lg:border-black lg:border-dashed mb-2 w-8">
      <div class="body text-gray-600 text-justify">{{ include.caption }}</div>
    </div>
    {% endif %}
  </div>
  <div class="w-full lg:w-2/3">
    {% if include.video %}
    <video class="w-full h-auto" autoplay muted playsinline loop>
      <source src="{{ '/images/' | relative_url }}{{ include.video }}.mp4" type="video/mp4">
      <source src="{{ '/images/' | relative_url }}{{ include.video }}.webm" type="video/webm">
    </video>
    {% else %}
    <img class="w-full h-auto" src="{{ '/images/' | relative_url }}{{ include.image }}" alt="{{ include.title | default: '' }}">
    {% endif %}
  </div>
</div>
