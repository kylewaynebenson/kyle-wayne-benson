<script>
  var workUrls = [
    {% assign sorted_work = site.work | sort: "year" | reverse %}{% for post in sorted_work %}"{{ post.url }}"{% unless forloop.last %},{% endunless %}{% endfor %}
  ];
  window.location.replace(workUrls[Math.floor(Math.random() * workUrls.length)]);
</script>
